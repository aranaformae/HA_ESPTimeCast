blueprint:
  name: ESPTimeCast - Deurbel of sensorbericht
  description: Toon een bericht wanneer een sensor de gekozen status krijgt. Wachtrijberichten vervallen na twee minuten.
  domain: automation
  homeassistant:
    min_version: 2026.9.0
  input:
    device:
      name: ESPTimeCast
      selector:
        device:
          integration: esptimecast
    sensor:
      name: Deurbel of andere statusentiteit
      selector:
        entity: {}
    state:
      name: Activerende status
      default: 'on'
      selector:
        text: {}
    message:
      name: Bericht (maximaal 120 tekens)
      default: Er staat iemand voor de deur
      selector:
        text: {}
triggers:
  - trigger: state
    entity_id: !input sensor
    to: !input state
conditions:
  - condition: template
    value_template: "{{ trigger.from_state is not none and trigger.from_state.state not in ['unknown', 'unavailable'] }}"
actions:
  - action: esptimecast.queue_message
    data:
      device_id: !input device
      message: !input message
      seconds: 15
      ttl: 120
mode: single
