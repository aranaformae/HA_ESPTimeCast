    - switch.esptimecast_alarm_1_monday
    - switch.esptimecast_alarm_1_tuesday
    - switch.esptimecast_alarm_1_wednesday
    - switch.esptimecast_alarm_1_thursday
    - switch.esptimecast_alarm_1_friday
    - switch.esptimecast_alarm_1_saturday
    - switch.esptimecast_alarm_1_sunday
